<header>
  <div class="wrap">
    <img class="brand" src="{{ base }}/static/img/struzon-logo.png"
         alt="Struzon Technologies Pvt. Ltd &mdash; Stands For Trust">

    <!-- Generating a register is the whole job; the screens over it are
         occasional, so they sit here as icons instead of taking a tab strip
         that made the main task look like one option out of five.

         Part Specs is the exception and is a page rather than a panel: it
         shares nothing with a register run - no uploaded package, no chain, no
         stage and round - so it is somewhere you go, and the way back is the
         only navigation it needs. -->
    <nav class="tools" aria-label="Other screens">
      {% if page == "specs" %}
      <a class="tool" href="{{ base }}/" title="Drawing register">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M5 12l5-5M5 12l5 5"/></svg>
        <span>Register</span>
      </a>
      {% else %}
      <button class="tool" data-sheet="trackers" title="Package trackers">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Trackers</span>
      </button>
      <a class="tool" href="{{ base }}/specs" title="Part specs, OLD vs NEW">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7M4 12h7M4 17h7M17 5v14M17 5l-3 3M17 5l3 3"/></svg>
        <span>Part Specs</span>
      </a>
      <button class="tool" data-sheet="settings" title="Extraction settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4.6 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 11.5 4a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9 2 2 0 1 1 0 4 1.7 1.7 0 0 0-1 .1z"/></svg>
        <span>Settings</span>
      </button>
      {% endif %}
    </nav>
  </div>
</header>
